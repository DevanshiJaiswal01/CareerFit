
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - CareerFit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">CareerFit</div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="skill.html">My Skills</a>
            <a href="interests.html">My Interests</a>
            <a href="login.html">Logout</a>
        </div>
    </nav>

    <section class="auth-container">

        <div class="auth-box">

            <h1>My Profile</h1>

            <p class="auth-subtitle">
                View and update your personal information.
            </p>

            <form id="profileForm">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="profileName"
                           placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail"
                           readonly
                           required>
                </div>

                <div class="form-group">
                    <label>Education</label>
                    <select id="profileEducation" required>
                        <option value="">Select qualification</option>
                        <option value="12th">12th</option>
                        <option value="Diploma">Diploma</option>
                        <option value="BCA">BCA</option>
                        <option value="BSc">BSc</option>
                        <option value="BTech">BTech</option>
                        <option value="MCA">MCA</option>
                        <option value="MSc">MSc</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>CGPA</label>
                    <input type="number" id="profileCgpa"
                           min="0" max="10" step="0.01"
                           placeholder="Enter your CGPA">
                </div>

                <button type="submit"
                        class="primary-button full-button">
                    Update Profile
                </button>

            </form>

            <p id="profileMessage"></p>

        </div>

    </section>

    <footer>
        <p>© 2026 CareerFit - Skill and Career Recommendation System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
