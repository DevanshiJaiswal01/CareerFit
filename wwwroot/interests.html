<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Interests - CareerFit</title>

<link rel="stylesheet"
      href="style.css">
```

</head>

<body>

```
<nav class="navbar">

    <div class="logo">
        CareerFit
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="skills.html">
            My Skills
        </a>

        <a href="interests.html">
            My Interests
        </a>

        <a href="login.html">
            Logout
        </a>

    </div>

</nav>


<section class="interest-section">

    <div class="interest-box">

        <h1>My Interests</h1>

        <p class="interest-subtitle">
            Select the career fields you are interested in.
        </p>


        <form id="interestForm">


            <label class="interest-card">

                <input
                    type="checkbox"
                    name="interest"
                    value="Web Development">

                <span class="interest-icon">
                    🌐
                </span>

                <span class="interest-content">

                    <strong>
                        Web Development
                    </strong>

                    <small>
                        HTML, CSS, JavaScript and websites
                    </small>

                </span>

            </label>


            <label class="interest-card">

                <input
                    type="checkbox"
                    name="interest"
                    value="Data Analysis">

                <span class="interest-icon">
                    📊
                </span>

                <span class="interest-content">

                    <strong>
                        Data Analysis
                    </strong>

                    <small>
                        Python, SQL, Excel and data visualization
                    </small>

                </span>

            </label>


            <label class="interest-card">

                <input
                    type="checkbox"
                    name="interest"
                    value="Artificial Intelligence">

                <span class="interest-icon">
                    🤖
                </span>

                <span class="interest-content">

                    <strong>
                        Artificial Intelligence
                    </strong>

                    <small>
                        AI, Machine Learning and Python
                    </small>

                </span>

            </label>


            <label class="interest-card">

                <input
                    type="checkbox"
                    name="interest"
                    value="Cyber Security">

                <span class="interest-icon">
                    🔐
                </span>

                <span class="interest-content">

                    <strong>
                        Cyber Security
                    </strong>

                    <small>
                        Networking, Linux and security
                    </small>

                </span>

            </label>


            <label class="interest-card">

                <input
                    type="checkbox"
                    name="interest"
                    value="Software Development">

                <span class="interest-icon">
                    💻
                </span>

                <span class="interest-content">

                    <strong>
                        Software Development
                    </strong>

                    <small>
                        C#, Java, Python and application development
                    </small>

                </span>

            </label>


            <label class="interest-card">

                <input
                    type="checkbox"
                    name="interest"
                    value="Cloud Computing">

                <span class="interest-icon">
                    ☁️
                </span>

                <span class="interest-content">

                    <strong>
                        Cloud Computing
                    </strong>

                    <small>
                        AWS, Azure and cloud technologies
                    </small>

                </span>

            </label>


            <label class="interest-card">

                <input
                    type="checkbox"
                    name="interest"
                    value="Database Management">

                <span class="interest-icon">
                    🗄️
                </span>

                <span class="interest-content">

                    <strong>
                        Database Management
                    </strong>

                    <small>
                        SQL, database design and administration
                    </small>

                </span>

            </label>


            <p id="interestError"
               class="error-message">
            </p>


            <button
                type="submit"
                class="primary-button full-button">

                Save My Interests

            </button>

        </form>

    </div>

</section>


<footer>

    <p>
        © 2026 Skill & Career Recommendation System
    </p>

</footer>


<script src="script.js"></script>
```

</body>

</html>
